# Deploy to the server on every push to main (and by hand from the Actions tab).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SERVER_HOST      server name or IP
#   SERVER_USERNAME  SSH user that may write to DEPLOY_PATH
#   SERVER_SSH       that user's private SSH key (the whole key, including the BEGIN/END lines)
#   SERVER_PORT      optional, default 22
#
# The Go program is built here (one static file, `acme`) and copied to DEPLOY_PATH together with web/, config/,
# lang/, database/, public/ and resources/. The service (systemd unit "acme", see README → Deploying) is restarted.
# The program serves HTTP on localhost; nginx in front adds HTTPS.
#
# Old code is removed and new code copied (rsync --delete), but these are never touched,
# because they hold the server's own data:
#   config/config.json  database password, mail settings (written by the installer; never in git)
#   storage/            logs, cache, attachments, generated PDFs, installed.lock
#   public/uploads/     uploaded logos, avatars, CRM files, editor images
# New database migrations run by themselves on the next page load.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false      # never stop a deploy half-way; the next one waits

permissions:
  contents: read

env:
  DEPLOY_PATH: /srv/acme
  SERVICE: acme

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the secrets are set
        id: secrets
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USERNAME }}
          KEY: ${{ secrets.SERVER_SSH }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "::warning::SERVER_HOST, SERVER_USERNAME and SERVER_SSH must be set as repository secrets. Nothing was deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-go@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          go-version-file: go.mod

      - name: Check and build (a broken build never goes live)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          go vet -composites=false ./...
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o acme ./cmd/acme

      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          PORT: ${{ secrets.SERVER_PORT || '22' }}
          KEY: ${{ secrets.SERVER_SSH }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts || { echo "::error::Could not reach $HOST:$PORT over SSH."; exit 1; }

      - name: Copy the new code (old files removed, server data kept)
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USERNAME }}
          PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o BatchMode=yes"
          $SSH "$USER@$HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -rlptz --delete --delay-updates --itemize-changes -e "$SSH" \
            --exclude='/.git/' --exclude='/.github/' --exclude='/node_modules/' --exclude='.DS_Store' \
            --exclude='/config/config.json' --exclude='/*.go' --exclude='/go.mod' --exclude='/go.sum' --exclude='/cmd/' --exclude='/internal/' --exclude='/docs/' \
            --filter='P /storage/***' \
            --filter='P /public/uploads/***' \
            ./ "$USER@$HOST:$DEPLOY_PATH/" | sed -n '1,200p'
          # config/config.json is not in git; on a new server the installer creates it from config/config.json.example.

      - name: Make storage and uploads writable for the service user
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USERNAME }}
          PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes "$USER@$HOST" "cd '$DEPLOY_PATH' && \
            if sudo -n true 2>/dev/null; then sudo -n chown -R acme:acme storage public/uploads config && echo 'storage, uploads and config owned by acme'; \
            else chmod -R ug+rwX storage public/uploads 2>/dev/null; echo 'no passwordless sudo: made storage and uploads group-writable (add $USER and the service user to one group)'; fi; \
            echo \"Deployed $GITHUB_SHA to $DEPLOY_PATH\""

      - name: Restart the service
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USERNAME }}
          PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
            "sudo -n systemctl restart $SERVICE && sleep 1 && systemctl is-active $SERVICE"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
